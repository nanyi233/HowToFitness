<!-- Training Module: Workout Logging -->
<header class="page-header training-header">
    <div class="header-left">
        <span class="header-date" id="trainingHeaderDate">Monday, June 12</span>
        <h1 class="header-title">🏋️ 训练记录</h1>
    </div>
</header>

<!-- Today's Training Summary Card -->
<section class="training-summary-card">
    <div class="training-summary-header">
        <span class="training-summary-label">TODAY'S TRAINING</span>
        <div class="date-controls">
            <input type="date" id="trainingDateSelector" class="date-input-mini">
        </div>
    </div>
    <div class="training-stats-row">
        <div class="training-stat">
            <span class="training-stat-value" id="totalExercises">0</span>
            <span class="training-stat-name">动作</span>
        </div>
        <div class="training-stat">
            <span class="training-stat-value" id="totalSets">0</span>
            <span class="training-stat-name">总组数</span>
        </div>
        <div class="training-stat">
            <span class="training-stat-value" id="totalVolume">0</span>
            <span class="training-stat-name">总容量(kg)</span>
        </div>
        <div class="training-stat">
            <span class="training-stat-value" id="trainingDuration">--</span>
            <span class="training-stat-name">时长(min)</span>
        </div>
    </div>
</section>

<!-- Exercise List -->
<section class="exercises-section">
    <div class="exercises-header">
        <h2>Today's Exercises</h2>
    </div>
    <div class="exercise-list" id="exerciseList">
        <p class="empty-message">暂无记录，快去添加训练吧 💪</p>
    </div>
</section>

<!-- Training Charts -->
<section class="training-charts-section">
    <div class="chart-toggle">
        <button class="chart-toggle-btn active" data-chart="intensity">💪 训练强度</button>
        <button class="chart-toggle-btn" data-chart="volume">📦 训练容量</button>
    </div>
    <!-- Training Intensity Chart -->
    <div class="card" id="trainingIntensityCard">
        <div class="stat-chart-head">
            <span class="stat-chart-label">💪 训练强度 vs 日期</span>
            <span class="stat-chart-sub">每日最大使用重量 (kg)</span>
        </div>
        <canvas id="trainingIntensityChart"></canvas>
    </div>
    <!-- Training Volume Chart -->
    <div class="card hidden" id="trainingVolumeCard">
        <div class="stat-chart-head">
            <span class="stat-chart-label">📦 训练容量 vs 日期</span>
            <span class="stat-chart-sub">每日总训练容量 (kg)</span>
        </div>
        <canvas id="trainingVolumeChart"></canvas>
    </div>
</section>
