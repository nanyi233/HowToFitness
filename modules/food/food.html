<!-- Food Module: Diet Tab -->
<header class="page-header diet-header">
    <div class="header-left">
        <span class="header-date" id="headerDate">Monday, June 12</span>
        <h1 class="header-title">🍎 饮食追踪</h1>
    </div>
</header>

<!-- Calories Remaining Card -->
<section class="calories-card">
    <div class="calories-card-header">
        <span class="calories-label">CALORIES REMAINING</span>
        <div class="date-controls">
            <input type="date" id="dateSelector" class="date-input-mini">
            <select id="dayType" class="day-type-pill">
                <option value="training">力训日</option>
                <option value="rest">休息日</option>
            </select>
        </div>
    </div>
    <div class="calories-big-row">
        <span class="calories-big" id="totalCalories">0</span>
        <span class="calories-total">/ 2,200</span>
        <div class="calories-progress">
            <div class="calories-progress-bar" id="caloriesProgressBar" style="width:0%"></div>
        </div>
    </div>
    <div class="macro-row">
        <div class="macro-item">
            <span class="macro-dot dot-carbs"></span>
            <div class="macro-info">
                <span class="macro-name">CARBS</span>
                <span class="macro-value"><strong id="totalCarbs">0</strong>g</span>
            </div>
        </div>
        <div class="macro-item">
            <span class="macro-dot dot-protein"></span>
            <div class="macro-info">
                <span class="macro-name">PROTEIN</span>
                <span class="macro-value"><strong id="totalProtein">0</strong>g</span>
            </div>
        </div>
        <div class="macro-item">
            <span class="macro-dot dot-fat"></span>
            <div class="macro-info">
                <span class="macro-name">FATS</span>
                <span class="macro-value"><strong id="totalFat">0</strong>g</span>
            </div>
        </div>
    </div>
</section>

<!-- Today's Meals -->
<section class="meals-section">
    <div class="meals-header">
        <h2>Today's Meals</h2>
    </div>
    <div class="food-list" id="foodList">
        <p class="empty-message">暂无记录，快去添加食物吧 🍽️</p>
    </div>
</section>

<!-- Nutrition Charts -->
<section class="food-charts-section">
    <div class="chart-toggle">
        <button class="chart-toggle-btn active" data-chart="training">🏋️ 力训日</button>
        <button class="chart-toggle-btn" data-chart="rest">😴 休息日</button>
    </div>
    <!-- Training Day Chart Card -->
    <div class="card" id="foodTrainingChartCard">
        <div class="stat-chart-head">
            <span class="stat-chart-label">🏋️ 力训日营养摄入</span>
        </div>
        <canvas id="foodTrainingDayChart"></canvas>
    </div>
    <!-- Rest Day Chart Card -->
    <div class="card hidden" id="foodRestChartCard">
        <div class="stat-chart-head">
            <span class="stat-chart-label">😴 休息日营养摄入</span>
        </div>
        <canvas id="foodRestDayChart"></canvas>
    </div>
</section>
