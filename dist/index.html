<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HowToFitness - 健康生活从记录开始</title>
    <meta name="description" content="HowToFitness - Track your diet, calculate aerobic calories, and plan your fitness journey">
    <meta name="theme-color" content="#2ecc71">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
/* === shared/styles/variables.css === */
/* ======================== GLOBAL DESIGN TOKENS ======================== */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    /* Primary Palette */
    --primary: #2ecc71;
    --primary-light: #d4f5e2;
    --primary-dark: #27ae60;
    --accent: #00bcd4;
    --accent-light: #e0f7fa;

    /* Backgrounds */
    --bg: #f5f7fa;
    --bg-card: #ffffff;
    --bg-input: #f0f2f5;

    /* Text */
    --text-primary: #1a2332;
    --text-secondary: #6b7b8d;
    --text-muted: #9ca8b7;

    /* Borders & Shadows */
    --border: #e8ecf0;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
    --shadow-card: 0 2px 12px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 16px rgba(0,0,0,0.10);

    /* Radius */
    --radius: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;

    /* Transitions */
    --transition: all 0.2s ease;

    /* Semantic Colors */
    --danger: #e74c3c;
    --warning: #f39c12;
    --info: #00bcd4;
    --success: #4CAF50;

    /* Layout */
    --tab-height: 68px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --max-width: 430px;

    /* Font */
    --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}


/* === shared/styles/reset.css === */
/* ======================== CSS RESET ======================== */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: var(--font-family);
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }
ul { list-style: none; }
img { max-width: 100%; display: block; }

/* ======================== SCROLLBAR ======================== */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }


/* === shared/styles/layout.css === */
/* ======================== APP SHELL ======================== */
.app-shell {
    max-width: var(--max-width);
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    background: var(--bg);
    padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 8px);
}

/* ======================== PAGE CONTAINER ======================== */
#page-container {
    padding: 0 16px 16px;
    animation: fadePageIn 0.25s ease;
}

@keyframes fadePageIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ======================== BOTTOM TAB BAR ======================== */
.tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: var(--max-width);
    height: var(--tab-height);
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding-bottom: var(--safe-bottom);
    z-index: 100;
}

.tab-bar-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 12px;
    color: var(--text-muted);
    transition: var(--transition);
    -webkit-tap-highlight-color: transparent;
}

.tab-bar-item span {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.02em;
}

.tab-bar-item svg {
    transition: var(--transition);
}

.tab-bar-item.active {
    color: var(--primary);
}

.tab-bar-item.active svg {
    stroke: var(--primary);
}


/* === shared/styles/components.css === */
/* ======================== PAGE HEADER ======================== */
.page-header {
    padding: 16px 0 12px;
}

.header-title {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-top: 2px;
    letter-spacing: -0.02em;
}

.header-title-center {
    font-size: 1.25rem;
    font-weight: 700;
    text-align: center;
    color: var(--text-primary);
}

.header-date {
    font-size: 0.82rem;
    color: var(--primary-dark);
    font-weight: 500;
}

/* ======================== CARDS ======================== */
.card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
}

.card h2 {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--primary);
    color: var(--primary-dark);
}

.card h3 {
    font-size: 1rem;
    margin: 14px 0 10px 0;
    color: var(--text-primary);
}

/* ======================== BUTTONS ======================== */
.btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 4px 12px rgba(46,204,113,0.3);
}

.btn-primary:active { transform: scale(0.98); }

.btn-secondary {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 12px;
}

.btn-secondary:active { transform: scale(0.98); }

/* ======================== FORM STYLES ======================== */
.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--text-primary);
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-xs);
    font-size: 0.95rem;
    background: var(--bg-input);
    color: var(--text-primary);
    transition: var(--transition);
    -webkit-appearance: none;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(46,204,113,0.12);
}

.form-group input:disabled,
.form-group select:disabled {
    background: var(--bg);
    cursor: not-allowed;
    opacity: 0.6;
}

.form-group input::placeholder { color: var(--text-muted); }

.form-group .hint {
    display: block;
    margin-top: 4px;
    font-size: 0.8rem;
    color: var(--text-secondary);
}

.duration-inputs {
    display: flex;
    align-items: center;
    gap: 8px;
}

.duration-inputs input {
    width: 80px;
    text-align: center;
}

.duration-inputs span {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

/* ======================== INFO BOXES ======================== */
.info-box {
    padding: 14px;
    border-radius: var(--radius-xs);
    margin: 10px 0;
}

.info-box h4 { margin-bottom: 6px; font-size: 0.95rem; }
.info-box p { margin: 4px 0; font-size: 0.9rem; }
.info-box ul { margin: 8px 0 0 20px; list-style: disc; }

.info-box.recommend {
    background: rgba(46,204,113,0.08);
    border-left: 4px solid var(--primary);
}

.info-box.warning {
    background: rgba(243,156,18,0.08);
    border-left: 4px solid var(--warning);
}

.info-box.tip {
    background: rgba(0,188,212,0.08);
    border-left: 4px solid var(--info);
}

/* ======================== TAG LISTS ======================== */
.tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}

.tag-list span {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
}

.tag-list.danger span {
    background: rgba(231,76,60,0.08);
    color: var(--danger);
}

.tag-list.warning span {
    background: rgba(243,156,18,0.08);
    color: var(--warning);
}

.tag-list.info span {
    background: rgba(0,188,212,0.08);
    color: var(--info);
}

/* ======================== CHECK LIST ======================== */
.check-list {
    list-style: none;
    padding-left: 0;
}

.check-list li {
    padding: 6px 0 6px 24px;
    position: relative;
    font-size: 0.9rem;
}

.check-list li::before {
    content: "✓";
    position: absolute;
    left: 0;
    color: var(--primary);
    font-weight: bold;
}

/* ======================== TABLES ======================== */
.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
}

.data-table th,
.data-table td {
    padding: 10px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border);
}

.data-table th {
    background: var(--bg-input);
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--text-secondary);
}

.data-table .value {
    font-weight: 700;
    color: var(--primary-dark);
}

/* ======================== RESULT GRID ======================== */
.result-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
}

.result-item {
    background: var(--bg-input);
    padding: 14px;
    border-radius: var(--radius-xs);
    text-align: center;
}

.result-item .label {
    display: block;
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-bottom: 4px;
}

.result-item .value {
    display: block;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--primary-dark);
}

.result-item .unit {
    font-size: 0.78rem;
    color: var(--text-muted);
}

.result-item .status { display: block; font-size: 0.75rem; margin-top: 2px; }
.result-item .status.normal { color: var(--primary); }
.result-item .status.warning { color: var(--warning); }
.result-item .status.danger { color: var(--danger); }

/* ======================== RESULT BOXES ======================== */
.result-box {
    padding: 14px;
    border-radius: var(--radius-xs);
    background: var(--bg-input);
}

.result-box h4 { margin-bottom: 10px; font-size: 0.95rem; }

.result-box .box-item {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
}

.result-box .box-item:last-child { border-bottom: none; }

.result-box .box-item.highlight {
    background: rgba(46,204,113,0.08);
    margin: 6px -10px;
    padding: 10px;
    border-radius: var(--radius-xs);
}

.result-box .box-item .value {
    font-weight: 700;
    color: var(--primary-dark);
}

.result-box.training-day { border-left: 4px solid var(--primary); }
.result-box.rest-day { border-left: 4px solid var(--accent); }

/* ======================== RESULT HIGHLIGHT ======================== */
.result-highlight {
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: var(--radius);
    color: white;
    margin-bottom: 14px;
}

.result-highlight .label {
    display: block;
    font-size: 0.85rem;
    opacity: 0.9;
    margin-bottom: 6px;
}

.result-highlight .value {
    display: block;
    font-size: 2.6rem;
    font-weight: 800;
}

.result-highlight .unit {
    font-size: 0.9rem;
    opacity: 0.9;
}

/* ======================== GUIDE SECTION ======================== */
.guide-section {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}

.guide-section:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
}

/* ======================== WARNING LIST ======================== */
.warning-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.warning-item {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: rgba(243,156,18,0.06);
    border-radius: var(--radius-xs);
}

.warning-item .icon { font-size: 1.1rem; }
.warning-item p { font-size: 0.88rem; }

/* ======================== KEY POINTS ======================== */
.key-points {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.point {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: var(--bg-input);
    border-radius: var(--radius-xs);
}

.point .icon { font-size: 1.3rem; width: 36px; text-align: center; }
.point strong { display: block; margin-bottom: 2px; color: var(--primary-dark); font-size: 0.9rem; }
.point p { font-size: 0.85rem; color: var(--text-secondary); }

/* ======================== FOOTER ======================== */
.module-footer {
    text-align: center;
    padding: 16px;
    color: var(--text-muted);
    font-size: 0.78rem;
}

.module-footer p { margin: 2px 0; }

/* ======================== UTILITY ======================== */
.hidden { display: none !important; }
.fade-in { animation: fadeIn 0.2s ease; }
.slide-up { animation: slideUp 0.25s ease; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ======================== EMPTY STATE ======================== */
.empty-message {
    text-align: center;
    color: var(--text-muted);
    padding: 28px 16px;
    font-size: 0.9rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
}


/* === modules/food/food.css === */
/* ======================== FOOD MODULE STYLES ======================== */

/* Diet Header */
.diet-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.header-left { flex: 1; }

/* ======================== CHAT SECTION ======================== */
.chat-section {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid var(--border);
}

.chat-messages {
    max-height: 300px;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Messages */
.message {
    display: flex;
    gap: 8px;
    animation: fadeIn 0.2s ease;
    max-width: 100%;
}

.bot-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
}

.bubble {
    background: var(--bg-input);
    border-radius: 0 var(--radius-sm) var(--radius-sm) var(--radius-sm);
    padding: 10px 14px;
    font-size: 0.88rem;
    color: var(--text-primary);
    line-height: 1.55;
    max-width: calc(100% - 44px);
}
.bubble ul { padding-left: 16px; margin-top: 6px; list-style: disc; }
.bubble li { margin: 3px 0; }
.bubble code {
    background: rgba(46,204,113,0.12);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.82rem;
    font-family: var(--font-mono);
    color: var(--primary-dark);
}

.system-message { max-width: 100%; }

.user-message { flex-direction: row-reverse; }
.user-message .bubble {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    border-radius: var(--radius-sm) 0 var(--radius-sm) var(--radius-sm);
}
.user-message .bot-avatar { display: none; }

.bot-message .bubble { background: var(--bg-input); }
.bot-message.success .bubble { border-left: 3px solid var(--primary); }
.bot-message.error .bubble { border-left: 3px solid var(--danger); }
.bot-message.info .bubble { border-left: 3px solid var(--accent); }

/* Chat Input */
.chat-input-container {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-card);
}

.chat-input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bg-input);
    border-radius: 999px;
    padding: 0 14px;
    border: 1px solid var(--border);
    transition: var(--transition);
}
.chat-input-wrapper:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(46,204,113,0.12);
}

.input-icon {
    font-size: 1rem;
    margin-right: 6px;
    flex-shrink: 0;
}

.chat-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 10px 0;
    font-size: 0.9rem;
    color: var(--text-primary);
}
.chat-input::placeholder { color: var(--text-muted); }

.send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(46,204,113,0.3);
    transition: var(--transition);
}
.send-btn:active { transform: scale(0.92); }

/* ======================== CALORIES CARD ======================== */
.calories-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
}

.calories-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.calories-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--primary-dark);
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.date-controls {
    display: flex;
    gap: 6px;
    align-items: center;
}

.date-input-mini {
    font-size: 0.75rem;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--bg-input);
    color: var(--text-primary);
    outline: none;
}
.date-input-mini:focus { border-color: var(--primary); }

.day-type-pill {
    font-size: 0.75rem;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--bg-input);
    color: var(--text-primary);
    outline: none;
    -webkit-appearance: none;
}

.calories-big-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
}

.calories-big {
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.03em;
    line-height: 1;
}

.calories-total {
    font-size: 1rem;
    color: var(--text-muted);
    font-weight: 500;
}

.calories-progress {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--bg-input);
    overflow: hidden;
    margin-top: 4px;
}

.calories-progress-bar {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transition: width 0.5s ease;
}

.macro-row {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 14px;
}

.macro-item {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: center;
}
.macro-item:not(:last-child) { border-right: 1px solid var(--border); }

.macro-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-carbs   { background: var(--warning); }
.dot-protein { background: var(--primary); }
.dot-fat     { background: #e74c3c; }

.macro-info { text-align: center; }
.macro-name { display: block; font-size: 0.65rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
.macro-value { font-size: 0.9rem; color: var(--text-primary); }
.macro-value strong { font-weight: 700; }

/* ======================== MEALS SECTION ======================== */
.meals-section { margin-bottom: 16px; }
.meals-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.meals-header h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }

.food-list { display: flex; flex-direction: column; gap: 10px; }

.food-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);

// === shared/js/event-bus.js ===
/**
 * Event Bus — cross-module communication
 */
const EventBus = {
    _listeners: {},

    /**
     * Subscribe to an event
     * @param {string} event
     * @param {function} callback
     * @returns {function} unsubscribe function
     */
    on(event, callback) {
        if (!this._listeners[event]) {
            this._listeners[event] = [];
        }
        this._listeners[event].push(callback);
        return () => this.off(event, callback);
    },

    /**
     * Unsubscribe from an event
     * @param {string} event
     * @param {function} callback
     */
    off(event, callback) {
        if (!this._listeners[event]) return;
        this._listeners[event] = this._listeners[event].filter(cb => cb !== callback);
    },

    /**
     * Emit an event
     * @param {string} event
     * @param {*} data
     */
    emit(event, data) {
        if (!this._listeners[event]) return;
        this._listeners[event].forEach(cb => {
            try {
                cb(data);
            } catch (err) {
                console.error(`EventBus error on "${event}":`, err);
            }
        });
    },

    /**
     * Clear all listeners (useful for cleanup)
     */
    clear() {
        this._listeners = {};
    }
};

// Make globally available
window.EventBus = EventBus;


// === shared/js/storage.js ===

 * Unified Storage Module
 * All localStorage operations go through here with consistent key prefixes
 */
const Storage = {
    KEYS: {
        DIET_RECORDS: 'htf_diet_records',
        WEIGHT_RECORDS: 'htf_weight_records',
        SETTINGS: 'htf_settings',

        AEROBIC_DATA: 'htf_aerobic_data',
        USER_PROFILE: 'htf_user_profile',
        TRAINING_RECORDS: 'htf_training_records',
        TRAINING_CHAT_HISTORY: 'htf_training_chat_history'
    },

    // ==================== Initialization ====================

    init() {
        if (!localStorage.getItem(this.KEYS.DIET_RECORDS)) {
            localStorage.setItem(this.KEYS.DIET_RECORDS, JSON.stringify({}));
        }
        if (!localStorage.getItem(this.KEYS.WEIGHT_RECORDS)) {
            localStorage.setItem(this.KEYS.WEIGHT_RECORDS, JSON.stringify([]));
        }
        if (!localStorage.getItem(this.KEYS.SETTINGS)) {
            localStorage.setItem(this.KEYS.SETTINGS, JSON.stringify({
                defaultDayType: 'training'
            }));
        }
        if (!localStorage.getItem(this.KEYS.CHAT_HISTORY)) {
            localStorage.setItem(this.KEYS.CHAT_HISTORY, JSON.stringify([]));
        }
        if (!localStorage.getItem(this.KEYS.TRAINING_RECORDS)) {
            localStorage.setItem(this.KEYS.TRAINING_RECORDS, JSON.stringify({}));
        }
        if (!localStorage.getItem(this.KEYS.TRAINING_CHAT_HISTORY)) {
            localStorage.setItem(this.KEYS.TRAINING_CHAT_HISTORY, JSON.stringify([]));
        }
    },

    // ==================== Migrate Old Keys ====================

    migrateOldKeys() {
        const migrations = [
            { oldKey: 'fitness_diet_records', newKey: this.KEYS.DIET_RECORDS },
            { oldKey: 'fitness_weight_records', newKey: this.KEYS.WEIGHT_RECORDS },
            { oldKey: 'fitness_settings', newKey: this.KEYS.SETTINGS },
            { oldKey: 'fitness_chat_history', newKey: this.KEYS.CHAT_HISTORY },
            { oldKey: 'fitness_plan_data', newKey: this.KEYS.PLAN_DATA },
            { oldKey: 'aerobic_calculator_data', newKey: this.KEYS.AEROBIC_DATA }
        ];

        migrations.forEach(({ oldKey, newKey }) => {
            const oldData = localStorage.getItem(oldKey);
            if (oldData && !localStorage.getItem(newKey)) {
                localStorage.setItem(newKey, oldData);
                localStorage.removeItem(oldKey);
            }
        });
    },

    // ==================== Diet Records ====================

    getDietRecords() {
        try {
            return JSON.parse(localStorage.getItem(this.KEYS.DIET_RECORDS)) || {};
        } catch (e) {
            console.error('Error reading diet records:', e);
            return {};
        }
    },

    getDietByDate(date) {
        const records = this.getDietRecords();
        return records[date] || {
            date: date,
            dayType: 'training',
            foods: [],
            totals: { calories: 0, protein: 0, carbs: 0, fat: 0 }
        };
    },

    saveDietRecord(date, data) {
        const records = this.getDietRecords();
        records[date] = {
            ...data,
            date: date,
            updatedAt: new Date().toISOString()
        };
        localStorage.setItem(this.KEYS.DIET_RECORDS, JSON.stringify(records));
    },

    addFood(date, food) {
        const dietRecord = this.getDietByDate(date);
        food.id = Date.now().toString();
        food.addedAt = new Date().toISOString();
        dietRecord.foods.push(food);
        dietRecord.totals = this.calculateTotals(dietRecord.foods);
        this.saveDietRecord(date, dietRecord);
        window.EventBus && EventBus.emit('food:added', { date, food });
        return food;
    },

    removeFood(date, foodId) {
        const dietRecord = this.getDietByDate(date);
        dietRecord.foods = dietRecord.foods.filter(f => f.id !== foodId);
        dietRecord.totals = this.calculateTotals(dietRecord.foods);
        this.saveDietRecord(date, dietRecord);
        window.EventBus && EventBus.emit('food:removed', { date, foodId });
    },

    setDayType(date, dayType) {
        const dietRecord = this.getDietByDate(date);
        dietRecord.dayType = dayType;
        this.saveDietRecord(date, dietRecord);
    },

    calculateTotals(foods) {
        return foods.reduce((totals, food) => ({
            calories: totals.calories + (food.calories || 0),
            protein: Math.round((totals.protein + (food.protein || 0)) * 10) / 10,
            carbs: Math.round((totals.carbs + (food.carbs || 0)) * 10) / 10,
            fat: Math.round((totals.fat + (food.fat || 0)) * 10) / 10
        }), { calories: 0, protein: 0, carbs: 0, fat: 0 });
    },

    getDietByDayType(dayType) {
        const records = this.getDietRecords();
        return Object.values(records)
            .filter(r => r.dayType === dayType && r.foods.length > 0)
            .sort((a, b) => new Date(a.date) - new Date(b.date));
    },

    getRecentDietRecords(dayType, limit = 7) {
        const records = this.getDietByDayType(dayType);
        return records.slice(-limit);
    },

    // ==================== Weight Records ====================

    getWeightRecords() {
        try {
            return JSON.parse(localStorage.getItem(this.KEYS.WEIGHT_RECORDS)) || [];
        } catch (e) {
            console.error('Error reading weight records:', e);
            return [];
        }
    },

    addWeightRecord(date, weight) {
        const records = this.getWeightRecords();
        const existingIndex = records.findIndex(r => r.date === date);
        const record = {
            date: date,
            weight: weight,
            updatedAt: new Date().toISOString()
        };
        if (existingIndex >= 0) {
            records[existingIndex] = record;
        } else {
            records.push(record);
        }
        records.sort((a, b) => new Date(a.date) - new Date(b.date));
        localStorage.setItem(this.KEYS.WEIGHT_RECORDS, JSON.stringify(records));
        window.EventBus && EventBus.emit('weight:updated', { date, weight });
        return record;
    },

    getWeightByDate(date) {
        const records = this.getWeightRecords();
        return records.find(r => r.date === date) || null;
    },

    getRecentWeightRecords(limit = 30) {
        const records = this.getWeightRecords();
        return records.slice(-limit);
    },

    // ==================== Chat History ====================

    getChatHistory() {
        try {
            return JSON.parse(localStorage.getItem(this.KEYS.CHAT_HISTORY)) || [];
        } catch (e) {
            console.error('Error reading chat history:', e);
            return [];
        }
    },

    addChatMessage(message) {
        const history = this.getChatHistory();
        const chatMessage = {
            id: Date.now().toString(),
            content: message.content,
            type: message.type,
            status: message.status || '',
            timestamp: new Date().toISOString()
        };
        history.push(chatMessage);
        const maxMessages = 100;
        if (history.length > maxMessages) {
            history.splice(0, history.length - maxMessages);
        }
        localStorage.setItem(this.KEYS.CHAT_HISTORY, JSON.stringify(history));
        return chatMessage;
    },

    getRecentChatHistory(limit = 50) {
        const history = this.getChatHistory();
        return history.slice(-limit);
    },

    clearChatHistory() {
        localStorage.setItem(this.KEYS.CHAT_HISTORY, JSON.stringify([]));
    },

    // ==================== Training Records ====================

    getTrainingRecords() {
        try {
            return JSON.parse(localStorage.getItem(this.KEYS.TRAINING_RECORDS)) || {};
        } catch (e) {
            console.error('Error reading training records:', e);
            return {};
        }
    },

    getTrainingByDate(date) {
        const records = this.getTrainingRecords();
        return records[date] || {
            date: date,
            exercises: [],
            duration: null
        };
    },

    saveTrainingRecord(date, data) {
        const records = this.getTrainingRecords();
        records[date] = {
            ...data,
            date: date,
            updatedAt: new Date().toISOString()
        };
        localStorage.setItem(this.KEYS.TRAINING_RECORDS, JSON.stringify(records));
    },

    addTrainingExercise(date, exercise) {
        const record = this.getTrainingByDate(date);
        exercise.id = Date.now().toString() + Math.random().toString(36).substr(2, 4);
        exercise.addedAt = new Date().toISOString();
        record.exercises.push(exercise);
        this.saveTrainingRecord(date, record);
        window.EventBus && EventBus.emit('training:added', { date, exercise });
        return exercise;
    },

    removeTrainingExercise(date, exerciseId) {
        const record = this.getTrainingByDate(date);
        record.exercises = record.exercises.filter(e => e.id !== exerciseId);
        this.saveTrainingRecord(date, record);
        window.EventBus && EventBus.emit('training:removed', { date, exerciseId });
    },

    setTrainingDuration(date, minutes) {
        const record = this.getTrainingByDate(date);
        record.duration = minutes;
        this.saveTrainingRecord(date, record);
    },

    /**
     * Get recent training records sorted by date
     * @param {number} limit - Max number of records to return
     * @returns {Array} - Array of { date, exercises, duration, totalVolume, totalSets, maxIntensity }
     */
    getRecentTrainingRecords(limit = 30) {
        const records = this.getTrainingRecords();
        return Object.values(records)
            .filter(r => r.exercises && r.exercises.length > 0)
            .sort((a, b) => new Date(a.date) - new Date(b.date))
            .slice(-limit)
            .map(r => {
                let totalVolume = 0;
                let totalSets = 0;
                let maxWeight = 0;
                r.exercises.forEach(ex => {
                    totalVolume += ex.volume || 0;
                    totalSets += ex.sets || 0;
                    if (ex.weight > maxWeight) maxWeight = ex.weight;
                });
                return {
                    date: r.date,
                    exercises: r.exercises,
                    exerciseCount: r.exercises.length,
                    duration: r.duration || 0,
                    totalVolume: totalVolume,
                    totalSets: totalSets,
                    maxIntensity: maxWeight
                };
            });
    },

    // ==================== Training Chat History ====================

    getTrainingChatHistory() {
        try {
            return JSON.parse(localStorage.getItem(this.KEYS.TRAINING_CHAT_HISTORY)) || [];
        } catch (e) {
            return [];
        }
    },

    addTrainingChatMessage(message) {
        const history = this.getTrainingChatHistory();
        const chatMessage = {
            id: Date.now().toString(),
            content: message.content,
            type: message.type,
            status: message.status || '',
            timestamp: new Date().toISOString()
        };
        history.push(chatMessage);
        if (history.length > 100) history.splice(0, history.length - 100);
        localStorage.setItem(this.KEYS.TRAINING_CHAT_HISTORY, JSON.stringify(history));
        return chatMessage;
    },

    getRecentTrainingChatHistory(limit = 50) {
        return this.getTrainingChatHistory().slice(-limit);
    },

    clearTrainingChatHistory() {
        localStorage.setItem(this.KEYS.TRAINING_CHAT_HISTORY, JSON.stringify([]));
    },

    // ==================== Plan Data ====================

    getPlanData() {
        try {
            return JSON.parse(localStorage.getItem(this.KEYS.PLAN_DATA)) || null;
        } catch (e) {
            return null;
        }
    },

    savePlanData(data) {
        localStorage.setItem(this.KEYS.PLAN_DATA, JSON.stringify(data));
    },

    // ==================== Aerobic Data ====================

    getAerobicData() {
        try {
            return JSON.parse(localStorage.getItem(this.KEYS.AEROBIC_DATA)) || null;
        } catch (e) {
            return null;
        }
    },

    saveAerobicData(data) {
        localStorage.setItem(this.KEYS.AEROBIC_DATA, JSON.stringify(data));
    },

    // ==================== User Profile (Shared) ====================

    getUserProfile() {
        try {
            return JSON.parse(localStorage.getItem(this.KEYS.USER_PROFILE)) || {};
        } catch (e) {
            return {};
        }
    },

    saveUserProfile(data) {
        localStorage.setItem(this.KEYS.USER_PROFILE, JSON.stringify(data));
        window.EventBus && EventBus.emit('profile:updated', data);
    },

    // ==================== Export / Import ====================

    exportData() {
        return {
            dietRecords: this.getDietRecords(),
            weightRecords: this.getWeightRecords(),
            planData: this.getPlanData(),
            aerobicData: this.getAerobicData(),
            userProfile: this.getUserProfile(),
            trainingRecords: this.getTrainingRecords(),
            exportedAt: new Date().toISOString()
        };
    },

    importData(data) {
        if (data.dietRecords) localStorage.setItem(this.KEYS.DIET_RECORDS, JSON.stringify(data.dietRecords));
        if (data.weightRecords) localStorage.setItem(this.KEYS.WEIGHT_RECORDS, JSON.stringify(data.weightRecords));
        if (data.planData) localStorage.setItem(this.KEYS.PLAN_DATA, JSON.stringify(data.planData));
        if (data.aerobicData) localStorage.setItem(this.KEYS.AEROBIC_DATA, JSON.stringify(data.aerobicData));
        if (data.userProfile) localStorage.setItem(this.KEYS.USER_PROFILE, JSON.stringify(data.userProfile));
        if (data.trainingRecords) localStorage.setItem(this.KEYS.TRAINING_RECORDS, JSON.stringify(data.trainingRecords));
    },

    clearAll() {
        Object.values(this.KEYS).forEach(key => localStorage.removeItem(key));
        this.init();
    }
};

/**
 * DeepSeek API Module
 * Centralized API call logic
 */

const API_CONFIG = {
    apiKey: 'sk-f498ca40814d498fa1da7ce70552001b',
    baseUrl: 'https://api.deepseek.com/v1/chat/completions',
    model: 'deepseek-chat'
};

const API = {
    /**
     * Call DeepSeek API
     * @param {string} prompt - User prompt
     * @param {string} systemPrompt - System prompt
     * @param {object} options - Optional: temperature, max_tokens
     * @returns {string} - API response content
     */
    async callDeepSeek(prompt, systemPrompt, options = {}) {
        const { temperature = 0.3, maxTokens = 500 } = options;

        const response = await fetch(API_CONFIG.baseUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_CONFIG.apiKey}`
            },
            body: JSON.stringify({
                model: API_CONFIG.model,
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: prompt }
                ],
                temperature,
                max_tokens: maxTokens
            })
        });

        if (!response.ok) throw new Error(`API request failed: ${response.status}`);
        const data = await response.json();
        return data.choices[0].message.content;
    },

    /**
     * Parse AI JSON response (strips markdown code blocks)
     * @param {string} raw - Raw response string
     * @returns {object} - Parsed JSON
     */
    parseJSONResponse(raw) {
        let clean = raw.trim();
        if (clean.startsWith('```json')) clean = clean.slice(7);
        if (clean.startsWith('```')) clean = clean.slice(3);
        if (clean.endsWith('```')) clean = clean.slice(0, -3);
        return JSON.parse(clean.trim());
    }
};

window.API = API;

/**
 * Utility functions shared across modules
 */

const Utils = {
    /**
     * Format date to YYYY-MM-DD
     * @param {Date} date
     * @returns {string}
     */
    formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    },

    /**
     * Get display date string (e.g., "Monday, June 12")
     * @param {Date} date
     * @returns {string}
     */
    getDisplayDate(date) {
        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        return `${days[date.getDay()]}, ${months[date.getMonth()]} ${date.getDate()}`;
    },

    /**
     * Get today's date string
     * @returns {string}
     */
    today() {
        return this.formatDate(new Date());
    }
};

window.Utils = Utils;

function searchFood(foodName) {
    const normalizedName = foodName.trim().toLowerCase();
    for (const [name, data] of Object.entries(FoodDatabase)) {
        if (name.toLowerCase() === normalizedName) return { name, ...data };
    }
    for (const [name, data] of Object.entries(FoodDatabase)) {
        if (name.toLowerCase().includes(normalizedName) || normalizedName.includes(name.toLowerCase())) return { name, ...data };
    }
    return null;
}

function calculateNutrition(foodData, grams) {
    const ratio = grams / 100;
    return {
        name: foodData.name,
        grams: grams,
        calories: Math.round(foodData.calories * ratio),
        protein: Math.round(foodData.protein * ratio * 10) / 10,
        carbs: Math.round(foodData.carbs * ratio * 10) / 10,
        fat: Math.round(foodData.fat * ratio * 10) / 10
    };
}

            this.addMessage('🤖 正在使用AI分析您的输入...', 'bot', 'info');

    async handleAIFoodInput(message) {
        if (this.isProcessing) {
            this.addMessage('⏳ 请等待上一个请求完成...', 'bot', 'info');

        }
        this.isProcessing = true;

        const systemPrompt = `你是一个饮食记录助手。用户会输入他们吃的食物，你需要解析出食物名称和克数，并提供每100g的营养信息。

如果无法解析，返回：{"success": false, "error": "原因"}
注意：1. 如果用户没有说明克数，请根据常识估算合理的份量 2. 营养数据请尽量准确 3. 只返回JSON，不要有其他文字`;

        try {

            if (!result.success) {

                return;
            }

            const nutrition = {
                name: result.food_name,
                grams: result.grams,
                calories: Math.round(result.per_100g.calories * result.grams / 100),
                protein: Math.round(result.per_100g.protein * result.grams / 100 * 10) / 10,
                carbs: Math.round(result.per_100g.carbs * result.grams / 100 * 10) / 10,
                fat: Math.round(result.per_100g.fat * result.grams / 100 * 10) / 10

            Storage.addFood(this.currentDate, nutrition);
            this.loadDayData();

            this.addMessage(
                `✅ <span class="ai-badge">AI</span> 已添加：<strong>${nutrition.name}</strong> ${nutrition.grams}g<br>` +
                `🔥 ${nutrition.calories}kcal · 🥩 ${nutrition.protein}g蛋白 · 🍚 ${nutrition.carbs}g碳水 · 🥑 ${nutrition.fat}g脂肪`,

    handleWeightInput(message) {

        if (!match) {
            this.addMessage('❌ 格式不正确，请使用：<code>体重 70.5</code>', 'bot', 'error');
            return;

        const weight = parseFloat(match[1]);
        if (weight < 20 || weight > 300) {
            this.addMessage('❌ 体重数值不合理，请输入20-300kg之间的数值', 'bot', 'error');
            return;
        }

        Storage.addWeightRecord(this.currentDate, weight);

        const weightRecords = Storage.getWeightRecords();
        let comparison = '';
        if (weightRecords.length >= 2) {
            const prevRecord = weightRecords[weightRecords.length - 2];
            const diff = weight - prevRecord.weight;
            if (diff > 0) comparison = `<br>📈 较上次(${prevRecord.date})增加了 <strong>${diff.toFixed(1)}kg</strong>`;
            else if (diff < 0) comparison = `<br>📉 较上次(${prevRecord.date})减少了 <strong>${Math.abs(diff).toFixed(1)}kg</strong>`;
            else comparison = `<br>➡️ 与上次(${prevRecord.date})持平`;

    setupEventListeners() {

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') this.handleUserInput();
            });

            sendBtn.addEventListener('click', () => this.handleUserInput());

        const dayData = Storage.getTrainingByDate(this.currentDate);
        this.updateSummary(dayData);
        this.renderExerciseList(dayData.exercises);
    },

    updateSummary(dayData) {
        const exercises = dayData.exercises || [];
        let totalSets = 0;
        let totalVolume = 0;

        exercises.forEach(ex => {
            totalSets += ex.sets || 0;
            totalVolume += ex.volume || 0;
        });

        const exEl = document.getElementById('totalExercises');
        if (exEl) exEl.textContent = exercises.length;

        const setsEl = document.getElementById('totalSets');
        if (setsEl) setsEl.textContent = totalSets;

        const volEl = document.getElementById('totalVolume');
        if (volEl) volEl.textContent = totalVolume;

        const durEl = document.getElementById('trainingDuration');
        if (durEl) durEl.textContent = dayData.duration || '--';
    },

    renderExerciseList(exercises) {
        const list = document.getElementById('exerciseList');
        if (!list) return;

        if (!exercises || exercises.length === 0) {
            list.innerHTML = '<p class="empty-message">暂无记录，快去添加训练吧 💪</p>';
            return;
        }

        // Find max volume for bar scaling
        const maxVolume = Math.max(...exercises.map(e => e.volume || 0), 1);

        list.innerHTML = exercises.map(ex => {
            const setsHtml = ex.setDetails && ex.setDetails.length > 0
                ? ex.setDetails.map((s, i) => `<span class="set-tag">S${i + 1}: ${s.weight}kg×${s.reps}</span>`).join('')
                : `<span class="set-tag">${ex.sets}组×${ex.reps}次 @ ${ex.weight}kg</span>`;

            const volumePercent = maxVolume > 0 ? Math.round((ex.volume / maxVolume) * 100) : 0;

            return `
                <div class="exercise-item fade-in" data-id="${ex.id}">
                    <div class="exercise-item-icon">🏋️</div>
                    <div class="exercise-item-info">
                        <div class="exercise-item-name">${ex.name}</div>
                        <div class="exercise-item-details">
                            ${ex.sets}组 · ${ex.weight}kg · 容量 ${ex.volume}kg
                        </div>
                        <div class="exercise-sets">${setsHtml}</div>
                        <div class="volume-bar">
                            <div class="volume-bar-fill" style="width: ${volumePercent}%"></div>
                        </div>
                    </div>
                    <button class="exercise-item-delete" onclick="TrainingModule.deleteExercise('${ex.id}')">✕</button>
                </div>
            `;
        }).join('');
    },

    // ==================== Chat Interface ====================

    handleUserInput() {
        const input = document.getElementById('trainingChatInput');
        const message = input.value.trim();
        if (!message) return;
        this.addMessage(message, 'user');
        input.value = '';
        this.processMessage(message);
    },

    addMessage(content, type, status = '', saveToHistory = true) {
        const chatMessages = document.getElementById('trainingChatMessages');
        if (!chatMessages) return;
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}-message ${status}`;

        if (type === 'user') {
            messageDiv.innerHTML = `<div class="bubble">${content}</div>`;
        } else {
            messageDiv.innerHTML = `
                <div class="bot-avatar">${type === 'system' ? '📌' : '🤖'}</div>
                <div class="bubble">${content}</div>
            `;
        }

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (saveToHistory && type !== 'system') {
            Storage.addTrainingChatMessage({ content, type, status });
        }
    },

    loadChatHistory() {
        const history = Storage.getRecentTrainingChatHistory(50);
        if (history.length === 0) return;

        const chatMessages = document.getElementById('trainingChatMessages');
        if (!chatMessages) return;

        const separator = document.createElement('div');
        separator.className = 'message system-message';
        separator.innerHTML = `<div class="bot-avatar">📜</div><div class="bubble"><small>以下是历史聊天记录 (${history.length}条)</small></div>`;
        chatMessages.appendChild(separator);

        history.forEach(msg => {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.type}-message ${msg.status || ''}`;
            if (msg.type === 'user') {
                messageDiv.innerHTML = `<div class="bubble">${msg.content}</div>`;
            } else {
                messageDiv.innerHTML = `<div class="bot-avatar">🤖</div><div class="bubble">${msg.content}</div>`;
            }
            chatMessages.appendChild(messageDiv);
        });

        const newSep = document.createElement('div');
        newSep.className = 'message system-message';
        newSep.innerHTML = `<div class="bot-avatar">✨</div><div class="bubble"><small>───── 新消息 ─────</small></div>`;
        chatMessages.appendChild(newSep);

        chatMessages.scrollTop = chatMessages.scrollHeight;
    },

    // ==================== Message Processing ====================

    processMessage(message) {
        const lower = message.toLowerCase();

        if (lower === '汇总' || lower === '总结') { this.showSummary(); return; }
        if (lower === '帮助' || lower === 'help') { this.showHelp(); return; }
        if (lower === '清除记录' || lower === '清除聊天' || lower === '清空聊天') { this.clearChatHistory(); return; }

        // Duration input
        const durationMatch = message.match(/训练时长\s*[:：]?\s*(\d+)\s*(分钟|min|m)?/i);
        if (durationMatch) {
            this.setDuration(parseInt(durationMatch[1]));
            return;
        }

        // Try local parsing first
        const parsed = this.tryLocalParse(message);
        if (parsed) {
            this.addExercise(parsed);
            return;
        }

        // Fallback to AI parsing
        this.handleAITrainingInput(message);
    },

    /**
     * Try to parse common patterns locally without AI
     * Patterns: "卧推 60kg 4组8个", "深蹲 80kg 5x5", "引体向上 自重 3组10个"
     */
    tryLocalParse(message) {
        // Pattern: 动作名 重量kg 组数x次数 or 组数组次数个
        const patterns = [
            // "卧推 60kg 4组8个" or "卧推 60kg 4组8次"
            /^(.+?)\s+(\d+(?:\.\d+)?)\s*[kK][gG]\s+(\d+)\s*[组x×]\s*(\d+)\s*[个次reps]?$/,
            // "卧推 60 4x8"
            /^(.+?)\s+(\d+(?:\.\d+)?)\s+(\d+)\s*[x×]\s*(\d+)$/,
            // "引体向上 自重 3组10个"
            /^(.+?)\s+自重\s+(\d+)\s*[组x×]\s*(\d+)\s*[个次reps]?$/,
        ];

        for (let i = 0; i < patterns.length; i++) {
            const match = message.match(patterns[i]);
            if (match) {
                if (i === 2) {
                    // Bodyweight pattern
                    return {
                        name: match[1].trim(),
                        weight: 0,
                        sets: parseInt(match[2]),
                        reps: parseInt(match[3]),
                        setDetails: this.generateSetDetails(0, parseInt(match[2]), parseInt(match[3]))
                    };
                } else {
                    return {
                        name: match[1].trim(),
                        weight: parseFloat(match[2]),
                        sets: parseInt(match[3]),
                        reps: parseInt(match[4]),
                        setDetails: this.generateSetDetails(parseFloat(match[2]), parseInt(match[3]), parseInt(match[4]))
                    };
                }
            }
        }

        return null;
    },

    generateSetDetails(weight, sets, reps) {
        const details = [];
        for (let i = 0; i < sets; i++) {
            details.push({ weight: weight, reps: reps });
        }
        return details;
    },

    addExercise(parsed) {
        const volume = parsed.weight * parsed.sets * parsed.reps;
        const exercise = {
            name: parsed.name,
            weight: parsed.weight,
            sets: parsed.sets,
            reps: parsed.reps,
            volume: volume,
            setDetails: parsed.setDetails || []
        };

        Storage.addTrainingExercise(this.currentDate, exercise);
        this.loadDayData();

        const weightStr = parsed.weight > 0 ? `${parsed.weight}kg` : '自重';
        this.addMessage(
            `✅ 已添加：<strong>${parsed.name}</strong><br>` +
            `🏋️ ${weightStr} · ${parsed.sets}组×${parsed.reps}次 · 容量 ${volume}kg`,
            'bot', 'success'
        );
    },

    // ==================== AI Parsing ====================

    async handleAITrainingInput(message) {
        if (this.isProcessing) {
            this.addMessage('⏳ 请等待上一个请求完成...', 'bot', 'info');
            return;
        }
        this.isProcessing = true;
        this.addMessage('🤖 正在使用AI分析您的训练内容...', 'bot', 'info', false);

        const systemPrompt = `你是一个力量训练记录助手。用户会描述他们的训练内容，你需要解析出每个训练动作的名称、重量（kg）、组数和每组次数。

请严格按照以下JSON格式返回，不要有任何其他文字：
{
    "success": true,
    "exercises": [
        {
            "name": "标准化的训练动作名称",
            "weight": 重量数字(kg，自重填0),
            "sets": 组数,
            "reps": 每组次数,
            "set_details": [
                {"weight": 重量, "reps": 次数},
                {"weight": 重量, "reps": 次数}
            ]
        }
    ],
    "duration": 训练时长分钟数(如果用户提及了时长，否则为null)
}

如果无法解析，返回：{"success": false, "error": "原因"}

注意：
1. 如果用户描述了多个动作，请分别解析
2. set_details 数组长度应等于组数
3. 如果用户没指定重量，根据动作合理估计或填0（自重）
4. 常见动作名称请标准化：如"卧推"、"深蹲"、"硬拉"、"引体向上"等
5. 只返回JSON`;

        try {
            const aiResponse = await API.callDeepSeek(message, systemPrompt, { maxTokens: 800 });
            const result = API.parseJSONResponse(aiResponse);

            if (!result.success) {
                this.addMessage(`❌ ${result.error || '无法解析您的训练内容'}`, 'bot', 'error');
                this.isProcessing = false;
                return;
            }

            // Process duration if provided
            if (result.duration) {
                Storage.setTrainingDuration(this.currentDate, result.duration);
            }

            // Process each exercise
            const exercises = result.exercises || [];
            if (exercises.length === 0) {
                this.addMessage('❌ 未能识别到训练动作，请重新描述', 'bot', 'error');
                this.isProcessing = false;
                return;
            }

            let summaryParts = [];
            exercises.forEach(ex => {
                const volume = ex.weight * ex.sets * ex.reps;
                const exercise = {
                    name: ex.name,
                    weight: ex.weight,
                    sets: ex.sets,
                    reps: ex.reps,
                    volume: volume,
                    setDetails: ex.set_details || this.generateSetDetails(ex.weight, ex.sets, ex.reps)
                };
                Storage.addTrainingExercise(this.currentDate, exercise);
                const weightStr = ex.weight > 0 ? `${ex.weight}kg` : '自重';
                summaryParts.push(`• <strong>${ex.name}</strong> ${weightStr} ${ex.sets}组×${ex.reps}次 (容量${volume}kg)`);
            });

            this.loadDayData();

            let msg = `✅ <span class="ai-badge">AI</span> 已添加 ${exercises.length} 个动作：<br>` + summaryParts.join('<br>');
            if (result.duration) {
                msg += `<br>⏱️ 训练时长：${result.duration}分钟`;
            }
            this.addMessage(msg, 'bot', 'success');

        } catch (error) {
            this.addMessage(`❌ AI服务暂时不可用，请稍后重试<br><small>${error.message}</small>`, 'bot', 'error');
        }
        this.isProcessing = false;
    },

    // ==================== Commands ====================

    setDuration(minutes) {
        if (minutes < 1 || minutes > 600) {
            this.addMessage('❌ 训练时长不合理，请输入1-600分钟之间的数值', 'bot', 'error');
            return;
        }
        Storage.setTrainingDuration(this.currentDate, minutes);
        this.loadDayData();
        this.addMessage(`✅ 已记录训练时长：<strong>${minutes}分钟</strong>`, 'bot', 'success');
    },

    showSummary() {
        const dayData = Storage.getTrainingByDate(this.currentDate);
        const exercises = dayData.exercises || [];

        let totalSets = 0;
        let totalVolume = 0;
        exercises.forEach(ex => {
            totalSets += ex.sets || 0;
            totalVolume += ex.volume || 0;
        });

        let html = `<strong>📊 ${this.currentDate} 训练汇总</strong><br><br>`;
        html += `<strong>动作数：</strong>${exercises.length}<br>`;
        html += `<strong>总组数：</strong>${totalSets}<br>`;
        html += `<strong>总容量：</strong>${totalVolume} kg<br>`;
        if (dayData.duration) html += `<strong>训练时长：</strong>${dayData.duration} 分钟<br>`;
        html += `<br><strong>动作列表：</strong><br>`;

        if (exercises.length === 0) {
            html += '暂无记录';
        } else {
            html += exercises.map(ex => {
                const weightStr = ex.weight > 0 ? `${ex.weight}kg` : '自重';
                return `• ${ex.name} ${weightStr} ${ex.sets}组×${ex.reps}次 (${ex.volume}kg)`;
            }).join('<br>');
        }

        this.addMessage(html, 'bot', 'info');
    },

    showHelp() {
        this.addMessage(
            `<strong>📖 训练记录帮助</strong><br><br>
            <strong>快速记录：</strong><br>
            格式：<code>动作名 重量kg 组数x次数</code><br>
            例如：<code>卧推 60kg 4组8个</code>、<code>深蹲 80kg 5x5</code><br><br>
            <strong>自重动作：</strong><code>引体向上 自重 3组10个</code><br>
            <strong>自然语言：</strong>"今天练了胸，卧推60做了4组8个"<br><br>
            <strong>记录时长：</strong><code>训练时长 60分钟</code><br>
            <strong>查看汇总：</strong>输入"汇总"<br>
            <strong>清除聊天：</strong>输入"清除记录"`,
            'bot', 'info'
        );
    },

    clearChatHistory() {
        Storage.clearTrainingChatHistory();
        const chatMessages = document.getElementById('trainingChatMessages');
        if (!chatMessages) return;
        const welcomeMessage = chatMessages.querySelector('.system-message');
        chatMessages.innerHTML = '';
        if (welcomeMessage) chatMessages.appendChild(welcomeMessage);
        this.addMessage('✅ 聊天记录已清除', 'bot', 'success', false);
    },

    deleteExercise(exerciseId) {
        Storage.removeTrainingExercise(this.currentDate, exerciseId);
        this.loadDayData();
        this.addMessage('✅ 已删除该训练记录', 'bot', 'success');
    }
};

/**
 * Stats Module — chart rendering
 */

const StatsModule = {
    charts: { training: null, rest: null, weight: null, frequency: null },

    init() {
        this.setupToggle();
        this.initCharts();
        this.updateCharts();
    },

    destroy() {
        // Destroy chart instances to free memory
        Object.values(this.charts).forEach(chart => {
            if (chart) chart.destroy();
        });
        this.charts = { training: null, rest: null, weight: null, frequency: null };
    },

    setupToggle() {
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => this.toggleChart(btn.dataset.chart));
        });
    },

    toggleChart(chartType) {
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.toggle-btn[data-chart="${chartType}"]`)?.classList.add('active');

        const weightCard = document.getElementById('weightChartCard');
        const trainingCard = document.getElementById('trainingChartCard');
        const restCard = document.getElementById('restChartCard');
        const frequencyCard = document.getElementById('frequencyCard');

        // Hide all
        [weightCard, trainingCard, restCard, frequencyCard].forEach(c => {
            if (c) c.classList.add('hidden');
        });

        if (chartType === 'weight') {
            weightCard?.classList.remove('hidden');
        } else if (chartType === 'calories') {
            trainingCard?.classList.remove('hidden');
            restCard?.classList.remove('hidden');
        } else if (chartType === 'training') {
            frequencyCard?.classList.remove('hidden');
        }
    },

    initCharts() {
        Chart.defaults.color = '#6b7b8d';
        Chart.defaults.borderColor = '#e8ecf0';
        Chart.defaults.font.family = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

            backgroundColor: '#fff', titleColor: '#1a2332', bodyColor: '#6b7b8d',
            borderColor: '#e8ecf0', borderWidth: 1, cornerRadius: 8, padding: 10
        };

            });
        }

        // Rest day chart
        const restCtx = document.getElementById('restDayChart')?.getContext('2d');
        if (restCtx) {
            this.charts.rest = new Chart(restCtx, {
                type: 'bar',
                data: { labels: [], datasets: [
                    { label: '蛋白质 (g)', data: [], backgroundColor: 'rgba(46,204,113,0.7)', borderColor: '#2ecc71', borderWidth: 1, borderRadius: 6 },
                    { label: '碳水 (g)', data: [], backgroundColor: 'rgba(243,156,18,0.7)', borderColor: '#f39c12', borderWidth: 1, borderRadius: 6 },
                    { label: '脂肪 (g)', data: [], backgroundColor: 'rgba(231,76,60,0.6)', borderColor: '#e74c3c', borderWidth: 1, borderRadius: 6 }
                ]},
                options: { responsive: true, maintainAspectRatio: true, scales: { x: { grid: gridOpts }, y: { beginAtZero: true, grid: gridOpts } }, plugins: { legend: { position: 'top', labels: { color: '#6b7b8d', usePointStyle: true, pointStyle: 'circle' } }, tooltip: chartTooltip } }
            });

        // Weight chart
        const weightCtx = document.getElementById('weightChart')?.getContext('2d');
        if (weightCtx) {
            this.charts.weight = new Chart(weightCtx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '体重 (kg)', data: [], fill: true, backgroundColor: 'rgba(0,188,212,0.08)', borderColor: '#00bcd4', borderWidth: 2.5, tension: 0.35, pointBackgroundColor: '#00bcd4', pointBorderColor: '#fff', pointBorderWidth: 2, pointRadius: 5, pointHoverRadius: 7 }] },
                options: { responsive: true, maintainAspectRatio: true, scales: { x: { grid: gridOpts }, y: { beginAtZero: false, grid: gridOpts } }, plugins: { legend: { display: false }, tooltip: chartTooltip } }
            });
        }

        // Training Frequency chart (bar chart)
        const freqCtx = document.getElementById('frequencyChart')?.getContext('2d');
        if (freqCtx) {
            this.charts.frequency = new Chart(freqCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '训练动作数',
                            data: [],
                            backgroundColor: 'rgba(155,89,182,0.7)',
                            borderColor: '#9b59b6',
                            borderWidth: 1,
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            grid: gridOpts,
                            title: { display: true, text: '日期', color: '#6b7b8d', font: { size: 11 } }
                        },
                        y: {
                            beginAtZero: true,
                            grid: gridOpts,
                            ticks: { stepSize: 1 },
                            title: { display: true, text: '训练动作数', color: '#9b59b6', font: { size: 11 } }

                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: chartTooltip

    updateCharts() {
        // Training day chart
        if (this.charts.training) {
            const trainingRecords = Storage.getRecentDietRecords('training', 7);
            this.charts.training.data.labels = trainingRecords.map(r => r.date.slice(5));
            this.charts.training.data.datasets[0].data = trainingRecords.map(r => r.totals.protein);
            this.charts.training.data.datasets[1].data = trainingRecords.map(r => r.totals.carbs);
            this.charts.training.data.datasets[2].data = trainingRecords.map(r => r.totals.fat);
            this.charts.training.update();
        }

        // Rest day chart
        if (this.charts.rest) {
            const restRecords = Storage.getRecentDietRecords('rest', 7);
            this.charts.rest.data.labels = restRecords.map(r => r.date.slice(5));
            this.charts.rest.data.datasets[0].data = restRecords.map(r => r.totals.protein);
            this.charts.rest.data.datasets[1].data = restRecords.map(r => r.totals.carbs);
            this.charts.rest.data.datasets[2].data = restRecords.map(r => r.totals.fat);
            this.charts.rest.update();
        }

        // Weight chart
        if (this.charts.weight) {
            const weightRecords = Storage.getRecentWeightRecords(30);
            this.charts.weight.data.labels = weightRecords.map(r => r.date.slice(5));
            this.charts.weight.data.datasets[0].data = weightRecords.map(r => r.weight);
            this.charts.weight.update();

            if (weightRecords.length > 0) {
                const el = document.getElementById('latestWeight');
                if (el) el.textContent = weightRecords[weightRecords.length - 1].weight;
            }
        }

        // Training Frequency chart
        if (this.charts.frequency) {
            const trainingData = Storage.getRecentTrainingRecords(14);
            this.charts.frequency.data.labels = trainingData.map(r => r.date.slice(5));
            this.charts.frequency.data.datasets[0].data = trainingData.map(r => r.exerciseCount || 0);
            this.charts.frequency.update();
        }
    }
};

/**
 * Profile Module
 */

const ProfileModule = {
    init() {
        this.updateProfileStats();
    },

    destroy() {},

    updateProfileStats() {
        // Streak
        const records = Storage.getDietRecords();
        let streak = 0;
        const today = new Date();
        for (let i = 0; i < 365; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            const key = Utils.formatDate(d);
            if (records[key] && records[key].foods && records[key].foods.length > 0) {
                streak++;
            } else if (i > 0) {
                break;
            }
        }
        const streakEl = document.getElementById('streakDays');
        if (streakEl) streakEl.textContent = streak > 0 ? `${streak} Days` : '0';

        // Latest weight
        const weightRecords = Storage.getWeightRecords();
        const profileWeightEl = document.getElementById('profileWeight');
        if (weightRecords.length > 0) {
            const latest = weightRecords[weightRecords.length - 1];
            if (profileWeightEl) profileWeightEl.textContent = `${latest.weight} kg`;
        } else {
            if (profileWeightEl) profileWeightEl.textContent = '--';
        }

        // BMI
        const bmiEl = document.getElementById('profileBMI');
        if (bmiEl && weightRecords.length > 0) {
            const w = weightRecords[weightRecords.length - 1].weight;
            const h = 1.75; // default height
            bmiEl.textContent = (w / (h * h)).toFixed(1);
        }
    },

    showHelp() {
        alert('📖 使用帮助\n\n在"饮食"页面输入食物名称和克数来记录饮食。\n例如：鸡胸肉 150g\n\n也可以用自然语言输入，AI会自动解析。');
    },

    clearChatHistory() {
        if (confirm('确定要清除所有聊天记录吗？')) {
            Storage.clearChatHistory();
            alert('✅ 聊天记录已清除');
        }
    }
};

    { name: "坚果", amount: 20, unit: "g", icon: "🥜" }
];

function calculateAerobicCalories(weight, perKg) {
    let baseCalories = weight * perKg;
    if (weight > 80) {
        const excessWeight = weight - 80;
        const reductionSteps = Math.floor(excessWeight / 5);
        const reductionFactor = Math.pow(0.97, reductionSteps);
        baseCalories = baseCalories * reductionFactor;
    }
    return Math.round(baseCalories);
}

const AerobicModule = {
    init() {
        this.populateCategories();
        this.setupEventListeners();
        this.loadSavedData();
    },

    destroy() {},

    populateCategories() {
        const categorySelect = document.getElementById('exerciseCategory');
        if (!categorySelect) return;
        categorySelect.innerHTML = '<option value="">请选择运动类型</option>';
        for (const [category, data] of Object.entries(EXERCISE_DATA)) {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = `${data.icon} ${category}`;
            categorySelect.appendChild(option);
        }
    },

    populateLevels(category) {
        const levelSelect = document.getElementById('exerciseLevel');
        if (!levelSelect) return;
        if (!category || !EXERCISE_DATA[category]) {
            levelSelect.innerHTML = '<option value="">请先选择运动类型</option>';
            levelSelect.disabled = true;
            return;
        }
        const data = EXERCISE_DATA[category];
        levelSelect.innerHTML = '<option value="">请选择强度/速度</option>';
        data.levels.forEach((level, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = level.name + (level.note ? ` (${level.note})` : '');
            levelSelect.appendChild(option);
        });
        levelSelect.disabled = false;
    },

    setupEventListeners() {
        const categoryEl = document.getElementById('exerciseCategory');
        if (categoryEl) {
            categoryEl.addEventListener('change', (e) => {
                this.populateLevels(e.target.value);
                this.saveData();
            });
        }

        const form = document.getElementById('aerobicForm');
        if (form) {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                this.calculate();
            });
        }

        const inputs = document.querySelectorAll('#aerobicForm input, #aerobicForm select');
        inputs.forEach(input => {
            input.addEventListener('change', () => this.saveData());
        });
    },

    calculate() {
        const weight = parseFloat(document.getElementById('aeroWeight')?.value);
        const category = document.getElementById('exerciseCategory')?.value;
        const levelIndex = document.getElementById('exerciseLevel')?.value;
        const hours = parseInt(document.getElementById('durationHours')?.value) || 0;
        const minutes = parseInt(document.getElementById('durationMinutes')?.value) || 0;
        const frequency = parseInt(document.getElementById('frequency')?.value);

        if (!weight || !category || levelIndex === '') {
            alert('请填写所有必填项');
            return;
        }

        const level = EXERCISE_DATA[category].levels[levelIndex];
        const totalHours = hours + minutes / 60;

        const hourlyCalories = calculateAerobicCalories(weight, level.perKg);
        const singleCalories = Math.round(hourlyCalories * totalHours);
        const weeklyCalories = singleCalories * frequency;
        const dailyAvgCalories = Math.round(weeklyCalories / 7);

        this.displayResults({ hourlyCalories, singleCalories, weeklyCalories, dailyAvgCalories });
        this.saveData();
    },

    displayResults(results) {
        const card = document.getElementById('aeroResultCard');
        if (card) card.style.display = 'block';

        const els = {
            hourlyCalories: document.getElementById('hourlyCalories'),
            singleCalories: document.getElementById('singleCalories'),
            weeklyCalories: document.getElementById('weeklyCalories'),
            dailyAvgCalories: document.getElementById('dailyAvgCalories'),
            planValue: document.getElementById('planValue')
        };

        if (els.hourlyCalories) els.hourlyCalories.textContent = results.hourlyCalories;
        if (els.singleCalories) els.singleCalories.textContent = results.singleCalories;
        if (els.weeklyCalories) els.weeklyCalories.textContent = results.weeklyCalories;
        if (els.dailyAvgCalories) els.dailyAvgCalories.textContent = results.dailyAvgCalories;
        if (els.planValue) els.planValue.textContent = results.dailyAvgCalories;

        const foodGrid = document.getElementById('foodEquivalent');
        if (foodGrid) {
            const multiplier = results.dailyAvgCalories / 100;
            foodGrid.innerHTML = FOOD_EQUIVALENTS.map(food => {
                const amount = Math.round(food.amount * multiplier * 10) / 10;
                return `<div class="food-equiv-item"><span>${food.icon}</span><span class="amount">${amount}${food.unit}</span><span>${food.name}</span></div>`;
            }).join('');
        }

        card?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },

    saveData() {
        const data = {
            weight: document.getElementById('aeroWeight')?.value,
            category: document.getElementById('exerciseCategory')?.value,
            level: document.getElementById('exerciseLevel')?.value,
            hours: document.getElementById('durationHours')?.value,
            minutes: document.getElementById('durationMinutes')?.value,
            frequency: document.getElementById('frequency')?.value
        };
        Storage.saveAerobicData(data);
    },

    loadSavedData() {
        const data = Storage.getAerobicData();
        if (!data) return;
        try {
            if (data.weight) { const el = document.getElementById('aeroWeight'); if (el) el.value = data.weight; }
            if (data.category) {
                const el = document.getElementById('exerciseCategory'); if (el) el.value = data.category;
                this.populateLevels(data.category);
                if (data.level) { const lvl = document.getElementById('exerciseLevel'); if (lvl) lvl.value = data.level; }
            }
            if (data.hours) { const el = document.getElementById('durationHours'); if (el) el.value = data.hours; }
            if (data.minutes) { const el = document.getElementById('durationMinutes'); if (el) el.value = data.minutes; }
            if (data.frequency) { const el = document.getElementById('frequency'); if (el) el.value = data.frequency; }
        } catch (e) { console.error('Error loading aerobic data:', e); }
    }
};

/**
