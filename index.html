<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HowToFitness - 健康生活从记录开始</title>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="shared/styles/variables.css">
    <link rel="stylesheet" href="shared/styles/reset.css">
    <link rel="stylesheet" href="shared/styles/layout.css">
    <link rel="stylesheet" href="shared/styles/components.css">

    <!-- Chart.js (only loaded once) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-shell">
        <!-- Dynamic Page Content -->
        <div id="page-container">
            <p class="empty-message" style="margin-top: 40vh;">Loading...</p>
        </div>

        <!-- Bottom Tab Bar (7 tabs) -->
        <nav class="tab-bar">
            <button class="tab-bar-item active" data-module="home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>焚决</span>
            </button>

            <button class="tab-bar-item" data-module="food">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
                <span>Diet</span>
            </button>
            <button class="tab-bar-item" data-module="training">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M12 2v4"/><path d="M12 18v4"/><rect x="2" y="6" width="4" height="12" rx="1"/><rect x="18" y="6" width="4" height="12" rx="1"/></svg>
                <span>Train</span>
            </button>
            <button class="tab-bar-item" data-module="profile">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <!-- Shared JS (loaded first) -->
    <script src="shared/js/event-bus.js"></script>
    <script src="shared/js/storage.js"></script>
    <script src="shared/js/api.js"></script>
    <script src="shared/js/utils.js"></script>

    <!-- Module JS (loaded eagerly, small enough) -->
    <script src="modules/food/food-database.js"></script>
    <script src="modules/food/food.js"></script>
    <script src="modules/home/home.js?v=2"></script>
    <script src="modules/training/training.js"></script>

    <script src="modules/profile/profile.js"></script>
    <script src="modules/auth/auth.js"></script>


    <!-- App Bootstrap -->
    <script>
    /**
     * App Bootstrap — simplified router (no ES modules needed)
     * Loads HTML fragments and initializes module instances
     */
    const AppRouter = {
        currentModule: null,
        pageContainer: null,
        tabBar: null,
        isAuthenticated: false,

        modules: {
            auth:     { html: 'modules/auth/auth.html',         css: 'modules/auth/auth.css',         instance: window.AuthModule },
            home:     { html: 'modules/home/home.html',         css: 'modules/home/home.css',         instance: window.HomeModule },
            food:     { html: 'modules/food/food.html',         css: 'modules/food/food.css',         instance: window.FoodModule },
            training: { html: 'modules/training/training.html', css: 'modules/training/training.css', instance: window.TrainingModule },
            profile:  { html: 'modules/profile/profile.html',   css: 'modules/profile/profile.css',   instance: window.ProfileModule }
        },

        init() {
            this.pageContainer = document.getElementById('page-container');
            this.tabBar = document.querySelector('.tab-bar');

            // Tab bar click handlers
            document.querySelectorAll('.tab-bar-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const moduleName = btn.dataset.module;
                    if (moduleName) this.navigate(moduleName);
                });
            });

            // Listen for auth events
            EventBus.on('auth:success', () => this.onAuthSuccess());
            EventBus.on('auth:logout', () => this.onAuthLogout());
            EventBus.on('auth:expired', () => this.onAuthLogout());

            // Check auth state and decide initial route
            this.checkAuthAndRoute();

            window.addEventListener('hashchange', () => {
                const mod = window.location.hash.replace('#', '');
                if (mod && this.modules[mod] && mod !== this.currentModule) {
                    // Prevent navigating to app pages when not authenticated
                    if (mod !== 'auth' && !this.isAuthenticated) {
                        this.navigate('auth');
                        return;
                    }
                    this.navigate(mod);
                }
            });
        },

        /**
         * Check if user is logged in (backend token) or using local mode,
         * then route to auth page or main app accordingly.
         */
        checkAuthAndRoute() {
            const hasToken = Storage.isLoggedIn();
            const isLocalMode = localStorage.getItem('htf_local_mode') === 'true';

            if (hasToken || isLocalMode) {
                this.isAuthenticated = true;
                this.showTabBar(true);
                const hash = window.location.hash.replace('#', '');
                const initial = hash && this.modules[hash] && hash !== 'auth' ? hash : 'home';
                this.navigate(initial);
            } else {
                // Show auth page
                this.isAuthenticated = false;
                this.showTabBar(false);
                this.navigate('auth');
            }
        },

        onAuthSuccess() {
            this.isAuthenticated = true;
            this.showTabBar(true);
            this.navigate('home');
        },

        onAuthLogout() {
            this.isAuthenticated = false;
            localStorage.removeItem('htf_local_mode');
            this.showTabBar(false);
            this.navigate('auth');
        },

        showTabBar(visible) {
            if (this.tabBar) {
                this.tabBar.style.display = visible ? '' : 'none';
            }
            // Adjust page container padding when tab bar is hidden
            const appShell = document.querySelector('.app-shell');
            if (appShell) {
                appShell.style.paddingBottom = visible ? '' : '0';
            }
        },

        async navigate(moduleName) {
            const config = this.modules[moduleName];
            if (!config) return;

            // Destroy current module
            if (this.currentModule && this.modules[this.currentModule]) {
                const cur = this.modules[this.currentModule];
                if (cur.instance && typeof cur.instance.destroy === 'function') {
                    cur.instance.destroy();
                }
                const oldStyle = document.getElementById(`style-${this.currentModule}`);
                if (oldStyle) oldStyle.remove();
            }

            // Load HTML
            try {
                const response = await fetch(config.html);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                this.pageContainer.innerHTML = html;
                // Re-trigger animation
                this.pageContainer.style.animation = 'none';
                this.pageContainer.offsetHeight; // force reflow
                this.pageContainer.style.animation = '';
            } catch (error) {
                console.error(`Failed to load module "${moduleName}":`, error);
                this.pageContainer.innerHTML = '<p class="empty-message">⚠️ 页面加载失败，请刷新重试</p>';
                return;
            }

            // Load module CSS
            if (config.css) {
                const link = document.createElement('link');
                link.id = `style-${moduleName}`;
                link.rel = 'stylesheet';
                link.href = config.css;
                document.head.appendChild(link);
            }

            // Initialize module
            if (config.instance && typeof config.instance.init === 'function') {
                config.instance.init();
            }

            // Update tab bar (skip for auth page)
            if (moduleName !== 'auth') {
                document.querySelectorAll('.tab-bar-item').forEach(b => b.classList.remove('active'));
                const activeTab = document.querySelector(`.tab-bar-item[data-module="${moduleName}"]`);
                if (activeTab) activeTab.classList.add('active');
            }

            window.location.hash = moduleName;
            this.currentModule = moduleName;
        }
    };

    // Boot the app
    document.addEventListener('DOMContentLoaded', () => {
        AppRouter.init();
    });
    </script>
</body>
</html>
