<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HowToFitness - 健康生活从记录开始</title>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="shared/styles/variables.css">
    <link rel="stylesheet" href="shared/styles/reset.css">
    <link rel="stylesheet" href="shared/styles/layout.css">
    <link rel="stylesheet" href="shared/styles/components.css">

    <!-- Chart.js (only loaded once) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-shell">
        <!-- Dynamic Page Content -->
        <div id="page-container">
            <p class="empty-message" style="margin-top: 40vh;">Loading...</p>
        </div>

        <!-- Bottom Tab Bar (5 tabs) -->
        <nav class="tab-bar">
            <button class="tab-bar-item active" data-module="food">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
                <span>Diet</span>
            </button>
            <button class="tab-bar-item" data-module="aerobic">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="m6.5 8 3.5 2v4l-3 5"/><path d="m17.5 8-3.5 2v4l3 5"/></svg>
                <span>Aerobic</span>
            </button>
            <button class="tab-bar-item" data-module="plan">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>Plan</span>
            </button>
            <button class="tab-bar-item" data-module="stats">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                <span>Stats</span>
            </button>
            <button class="tab-bar-item" data-module="profile">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <!-- Shared JS (loaded first) -->
    <script src="shared/js/event-bus.js"></script>
    <script src="shared/js/storage.js"></script>
    <script src="shared/js/api.js"></script>
    <script src="shared/js/utils.js"></script>

    <!-- Module JS (loaded eagerly, small enough) -->
    <script src="modules/food/food-database.js"></script>
    <script src="modules/food/food.js"></script>
    <script src="modules/stats/stats.js"></script>
    <script src="modules/profile/profile.js"></script>
    <script src="modules/aerobic/aerobic.js"></script>
    <script src="modules/plan/plan.js"></script>

    <!-- App Bootstrap -->
    <script>
    /**
     * App Bootstrap — simplified router (no ES modules needed)
     * Loads HTML fragments and initializes module instances
     */
    const AppRouter = {
        currentModule: null,
        pageContainer: null,

        modules: {
            food:    { html: 'modules/food/food.html',       css: 'modules/food/food.css',         instance: window.FoodModule },
            aerobic: { html: 'modules/aerobic/aerobic.html', css: 'modules/aerobic/aerobic.css',   instance: window.AerobicModule },
            plan:    { html: 'modules/plan/plan.html',       css: 'modules/plan/plan.css',         instance: window.PlanModule },
            stats:   { html: 'modules/stats/stats.html',     css: 'modules/stats/stats.css',       instance: window.StatsModule },
            profile: { html: 'modules/profile/profile.html', css: 'modules/profile/profile.css',   instance: window.ProfileModule }
        },

        init() {
            this.pageContainer = document.getElementById('page-container');

            // Tab bar click handlers
            document.querySelectorAll('.tab-bar-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const moduleName = btn.dataset.module;
                    if (moduleName) this.navigate(moduleName);
                });
            });

            // Hash-based routing
            const hash = window.location.hash.replace('#', '');
            const initial = hash && this.modules[hash] ? hash : 'food';
            this.navigate(initial);

            window.addEventListener('hashchange', () => {
                const mod = window.location.hash.replace('#', '');
                if (mod && this.modules[mod] && mod !== this.currentModule) {
                    this.navigate(mod);
                }
            });
        },

        async navigate(moduleName) {
            const config = this.modules[moduleName];
            if (!config) return;

            // Destroy current module
            if (this.currentModule && this.modules[this.currentModule]) {
                const cur = this.modules[this.currentModule];
                if (cur.instance && typeof cur.instance.destroy === 'function') {
                    cur.instance.destroy();
                }
                const oldStyle = document.getElementById(`style-${this.currentModule}`);
                if (oldStyle) oldStyle.remove();
            }

            // Load HTML
            try {
                const response = await fetch(config.html);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                this.pageContainer.innerHTML = html;
                // Re-trigger animation
                this.pageContainer.style.animation = 'none';
                this.pageContainer.offsetHeight; // force reflow
                this.pageContainer.style.animation = '';
            } catch (error) {
                console.error(`Failed to load module "${moduleName}":`, error);
                this.pageContainer.innerHTML = '<p class="empty-message">⚠️ 页面加载失败，请刷新重试</p>';
                return;
            }

            // Load module CSS
            if (config.css) {
                const link = document.createElement('link');
                link.id = `style-${moduleName}`;
                link.rel = 'stylesheet';
                link.href = config.css;
                document.head.appendChild(link);
            }

            // Initialize module
            if (config.instance && typeof config.instance.init === 'function') {
                config.instance.init();
            }

            // Update tab bar
            document.querySelectorAll('.tab-bar-item').forEach(b => b.classList.remove('active'));
            const activeTab = document.querySelector(`.tab-bar-item[data-module="${moduleName}"]`);
            if (activeTab) activeTab.classList.add('active');

            window.location.hash = moduleName;
            this.currentModule = moduleName;
        }
    };

    // Boot the app
    document.addEventListener('DOMContentLoaded', () => {
        AppRouter.init();
    });
    </script>
</body>
</html>
